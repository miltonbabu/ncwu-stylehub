name: stylehub
services:
  api:
    build:
      context: ../../java-backend
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deploy/aws/.env}
      DATABASE_USER: ${DATABASE_USER:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:?Set a strong SECRET_KEY in deploy/aws/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set your Vercel origin in deploy/aws/.env}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError
      APP_DEMO_ENABLED: "false"
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-ncwu-stylehub}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SITE_URL: ${SITE_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    volumes:
      - uploads:/app/uploads
    expose:
      - "8080"
    mem_limit: 1g
    cpus: 1.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uploads:
