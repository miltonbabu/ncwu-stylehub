# NCWU StyleHub — full stack on ONE server (AWS Lightsail / EC2)
# Start:  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stylehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong}
      POSTGRES_DB: stylehub
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ../../supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped

  api:
    build:
      context: ../../java-backend
    environment:
      # Same-box PostgreSQL (swap for a Supabase URL to use Supabase instead)
      DATABASE_URL: postgresql://stylehub:${POSTGRES_PASSWORD:-change-me-strong}@db:5432/stylehub
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string}
      CORS_ORIGINS: "*"
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
    depends_on:
      - api
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    restart: unless-stopped

volumes:
  dbdata:
